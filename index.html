<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="data:," />
    <title>Starfall Vale</title>
    <style>
      body {
        margin: 0;
        background: #1c2340;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(circle at 50% 60%, #2f6f74 0%, #1c2340 70%);
        color: #f4f1e8;
        font: 600 18px system-ui, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.6s;
        z-index: 10;
      }
      #loading h1 {
        margin: 0;
        color: #ffb347;
        font-size: 40px;
        letter-spacing: 1px;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Starfall Vale</h1>
      <div>Waking the Meridian...</div>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
